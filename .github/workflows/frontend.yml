name: Deploy Frontend

on:
  push:
    branches:
      - '*'
      - '*/*'
      - '**'

env:
  ENV_PATH: "./packages/frontend/.env"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup NodeJS
      uses: actions/setup-node@v6
      with:
        node-version: "24"

    - name: Install dependencies
      run: yarn install
      shell: bash

    - name: Populate env
      run: |
        touch "$ENV_PATH"
        echo VITE_FILES_BUCKET=${{ secrets.AWS_FILES_BUCKET_NAME }}>> "$ENV_PATH"
        echo VITE_GATEWAY_URL=${{ secrets.AWS_GATEWAY_URL }} >> "$ENV_PATH"
        echo VITE_IDENTITY_POOL_ID=${{ secrets.AWS_IDENTITY_POOL_ID }} >> "$ENV_PATH"
        echo VITE_REGION=${{ secrets.AWS_REGION }} >> "$ENV_PATH"
        echo VITE_BASE_URL=/ >> "$ENV_PATH"
        cat "$ENV_PATH"

    - name: Build assets
      run: yarn build:frontend

    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }} 

    - name: Push to S3
      run: |
        aws s3 sync ./packages/frontend/dist/ s3://${{ secrets.AWS_S3_BUCKET_NAME }}/ --delete

    - name: Invalidate Cache
      run: |
        aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_ID }} \
            --paths "/assets"
