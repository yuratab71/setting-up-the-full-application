name: Deploy Frontend

on:
  push:
    branches:
      - '*'
      - '*/*'
      - '**'

env:
  KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  REGION: ${{ secrets.AWS_REGION }}
  FILES_BUCKET: ${{ secrets.AWS_FILES_BUCKET_NAME }}
  BUCKET: ${{ secrets.AWS_S3_BUCKET_NAME }}
  GATEWAY_URL: ${{ secrets.AWS_GATEWAY_URL }}
  IDENTITY_POOL_ID: ${{ secrets.AWS_IDENTITY_POOL_ID }}
  CLOUDFRONT_ID: ${{ secrets.AWS_CLOUDFRONT_ID }}
  ENV_PATH: "./packages/frontend/.env"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup NodeJS
      uses: actions/setup-node@v6
      with:
        node-version: "24"

    - name: Install dependencies
      run: yarn install
      shell: bash

    - name: Populate env
      run: |
        touch "$ENV_PATH"
        echo VITE_FILES_BUCKET="$FILES_BUCKET" >> "$ENV_PATH"
        echo VITE_GATEWAY_URL="$GATEWAY_URL" >> "$ENV_PATH"
        echo VITE_IDENTITY_POOL_ID="$IDENTITY_POOL_ID" >> "$ENV_PATH"
        echo VITE_REGION="$REGION" >> "$ENV_PATH"
        echo VITE_BASE_URL="/cloudfront/$CLOUDFRONT_ID" >> "$ENV_PATH"
        cat "$ENV_PATH"

    - name: Build assets
      run: yarn build:frontend

    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: $KEY_ID
        aws-secret-access-key: $ACCESS_KEY
        aws-region: $REGION

    - name: Push to S3
      run: |
        aws s3 sync ./packages/frontend/dist/ s3://$BUCKET/
