name: Deploy Lambdas

on:
  push:
    branches:
      # - main // for testing
      - '*'
      - '*/*'
      - '**'

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup NodeJS
      uses: actions/setup-node@v6
      with:
        node-version: "24"

    - name: Install dependencies
      run: yarn install

    - name: Build assets
      run: yarn build:backend

    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }} 

    - name: Deploy Create Note lambda
      run: aws lambda update-function-code --function-name lambda-create --zip-file fileb://${GITHUB_WORKSPACE}/packages/backend/dist/createNote/app.js.zip

     
